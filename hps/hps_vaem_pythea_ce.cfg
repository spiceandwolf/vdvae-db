[run]

# run.name: Mandatory argument, used to identify runs for save and restore
name = vaem_ce

# run.seed: seed that fixes all randomness in the project
seed = 2025


[data]

# Data paths.
dataset_path = '../dataset/power7/original.csv'

pkl_path = './power/data.pkl'


[train]

# model saved path
output_dir = './saved_models/power_test/imputated_ce/test'

# batch_size
train_batch_size = 1024

eval_batch_size = 4096

# every attrabute's DVS
input_bins = None

# epochs / evaluating interval
eval_interval_in_steps = 200000

# total epochs
num_epochs = 10

learning_rate = 5e-4

warmup_iters = 1000

# Adam/Radam/Adamax parameters
adam_beta1 = 0.9

adam_beta2 = 0.999

margvae_finished = False


[margvaes]

# the number of every attrabute's DVS
input_bins = None

# the latent dims of every marginal VAE
latent_dims = None

# miss rate
missing_rate = 0.7


[dependencynet]

# batch_size
batch_size = 400

# the number of residual blocks
n_residual_blocks = 1

# the number of middle layers in the residual bottleneck block
n_residual_layers = 0

# the number of hidden dims
hidden_dims = 512

# the number of latent dims
latent_dims = 64

# the number of dims for input/output layer
input_dims = 1024

output_dims = 1024

# the number of every attrabute's DVS
input_bins = None

# total epochs
num_epochs = 10

learning_rate = 5e-4

# the dimension of feature map of PNP encoder
k = 100

# the dimension of feature embedding for each variable
m = 10

# miss rate
missing_rate = 0.7